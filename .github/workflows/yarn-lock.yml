name: Yarn Lock

on:
  schedule:
    # Scheduled runs are delayed the most on the hour, so this asks for an odd minute instead.
    - cron: '43 6 * * *'

jobs:
  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The Kotlin plugin brings its own Node.js and Yarn, so neither needs to be set up here.
      - name: Upgrade the lock file
        run: ./gradlew kotlinWasmUpgradeYarnLock

      # A pull request opened with the built-in token would not start CI, so the app opens it instead.
      - name: Create an app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Naming the file keeps anything else the build happens to touch out of the commit.
          add-paths: kotlin-js-store/wasm/yarn.lock
          branch: chore/update-wasm-yarn-lock
          delete-branch: true
          # Signing attributes the commit to the app rather than to the Actions bot.
          sign-commits: true
          commit-message: 'build: update the Wasm yarn.lock'
          title: 'build: update the Wasm yarn.lock'
          body: 'Generated by `./gradlew kotlinWasmUpgradeYarnLock`.'
