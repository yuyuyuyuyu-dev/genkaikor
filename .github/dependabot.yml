version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1

  # Every dependency is declared in the root version catalog, so one entry covers all modules.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    groups:
      # The Compose Multiplatform plugin refuses to match runtime artifacts from another
      # release, so bumping material3 on its own breaks the wasm build.
      # In a version catalog Dependabot names a plugin by its bare id, hence the two patterns.
      compose-multiplatform:
        patterns:
          - "org.jetbrains.compose"
          - "org.jetbrains.compose.*"
        exclude-patterns:
          # material-icons-extended tracks its own versions, see the version catalog.
          - "org.jetbrains.compose.material:material-icons-extended"
