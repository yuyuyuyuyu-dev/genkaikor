naming:
  FunctionNaming:
    # Composable functions are named in PascalCase by convention.
    ignoreAnnotated: ["Composable"]
    excludes:
      [
        "**/test/**",
        "**/androidTest/**",
        "**/commonTest/**",
        "**/jvmTest/**",
        "**/androidUnitTest/**",
        "**/androidInstrumentedTest/**",
        "**/jsTest/**",
        "**/iosTest/**",
        "**/wasmJsTest/**",
      ]
